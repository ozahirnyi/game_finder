name: Persistent business E2E

on:
  workflow_dispatch:
    inputs:
      fixture_key:
        description: Stable fixture key to reconcile and test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: persistent-business-e2e-${{ inputs.fixture_key }}
  cancel-in-progress: false

jobs:
  business-e2e:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Seed or reconcile persistent fixture
        env:
          FIXTURE_KEY: ${{ inputs.fixture_key }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.E2E_SECRET_KEY }}
          E2E_ENVIRONMENT: staging
          E2E_FIXTURE_EMAIL_DOMAIN: ${{ secrets.E2E_FIXTURE_EMAIL_DOMAIN }}
          E2E_FIXTURE_MARA_PASSWORD: ${{ secrets.E2E_FIXTURE_MARA_PASSWORD }}
          E2E_FIXTURE_JONAS_PASSWORD: ${{ secrets.E2E_FIXTURE_JONAS_PASSWORD }}
          E2E_FIXTURE_MARA_EMAIL: ${{ secrets.E2E_FIXTURE_MARA_EMAIL }}
          E2E_FIXTURE_JONAS_EMAIL: ${{ secrets.E2E_FIXTURE_JONAS_EMAIL }}
        run: alembic upgrade head && python -m scripts.fixture_admin seed --fixture-key "$FIXTURE_KEY" --json
      - name: Run real business flows
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
          E2E_ALLOWED_HOSTS: ${{ vars.E2E_ALLOWED_HOSTS }}
          E2E_FIXTURE_MARA_EMAIL: ${{ secrets.E2E_FIXTURE_MARA_EMAIL }}
          E2E_FIXTURE_MARA_PASSWORD: ${{ secrets.E2E_FIXTURE_MARA_PASSWORD }}
          E2E_FIXTURE_JONAS_EMAIL: ${{ secrets.E2E_FIXTURE_JONAS_EMAIL }}
          E2E_FIXTURE_JONAS_PASSWORD: ${{ secrets.E2E_FIXTURE_JONAS_PASSWORD }}
          E2E_FIXTURE_KEY: ${{ inputs.fixture_key }}
        run: npm run test:e2e:business
        working-directory: web
